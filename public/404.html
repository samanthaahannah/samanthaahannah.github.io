<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>

    <script>
      var redirect = window.location.pathname + window.location.search;
      sessionStorage.setItem("redirect", redirect);

      window.location.replace("/");
    </script>

    <h1>Redirecting…</h1>
  </body>
</html>
